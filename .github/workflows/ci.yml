name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: python -m pytest -q
      # The eval set runs in deterministic mode in CI (no API key): every
      # objective check must pass; LLM-only cases are reported as skipped.
      - name: Eval set (deterministic mode)
        run: python -m order_workflow.cli eval
